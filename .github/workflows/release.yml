name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (build)
        run: pnpm exec vue-tsc --project ./tsconfig.build.json --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          # Skip when version was already published (e.g. local publish then tag push)
          if npm view "ant-design-x-vue-next@${VERSION}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "Version ${VERSION} already on npm — skip publish."
          else
            npm publish --access public --ignore-scripts --registry https://registry.npmjs.org/
          fi

      - name: Create GitHub Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skip create."
          else
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
